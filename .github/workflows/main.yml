name: Build Aaron OS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: pacman -Syu --noconfirm archiso

    - name: Build ISO Image
      run: mkarchiso -v -w /tmp/archiso-tmp -o /tmp/archiso-out configs/releng/

    - name: Save My OS File
      uses: actions/upload-artifact@v4
      with:
        name: AaronOS-Installer
        path: /tmp/archiso-out/*.iso
